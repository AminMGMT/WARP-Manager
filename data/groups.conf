# WARP Manager - service catalogue.
#
# Format:
#   [Category Name]     starts a category
#   <provider-id>       one member per line, in the order they appear in the menu
#
# Display names are NOT repeated here: they come from name= in
# data/providers/<id>.conf, so a service is renamed in exactly one place.
#
# A category with a single member is toggled straight from the category list
# instead of opening a submenu (that is how the "All <vendor> Services" entries
# below behave).
#
# The same id may appear in more than one category (WeChat and WhatsApp are both
# social and messaging apps) — it is one setting shown in two places.

