id=remini
name=Remini
type=domain
# The engine matches a domain AND every subdomain of it (domain + domain_suffix),
# so remini.ai alone covers app./api./webapp./share./settings-cdn./yourplan. and the
# a.android./b.ios. API hosts. bendingspoons.com is the vendor's own domain, which
# the app and its support pages use; webapp/settings-cdn sit behind Fastly, but
# routing is by SNI so the CDN in front makes no difference.
domains=remini.ai bendingspoons.com
