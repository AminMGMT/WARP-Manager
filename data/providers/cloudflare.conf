id=cloudflare
name=Cloudflare
type=domain
# www.cloudflare.com is force-carved back to direct in the engine: the manager
# measures the server's own (non-WARP) connectivity against
# www.cloudflare.com/cdn-cgi/trace, and the auto IP health check refuses to
# rotate when that probe fails. Routing it would make WARP judge itself.
domains=cloudflare.com dash.cloudflare.com api.cloudflare.com workers.dev pages.dev
