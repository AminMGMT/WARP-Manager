id=youtube-music
name=YouTube Music
type=domain
# The engine keeps all of *.youtube.com direct on purpose (heavy video must not go
# through the tunnel). priority=1 lifts these exact domains above that carve-out so
# YouTube Music can be routed without dragging YouTube video along with it.
# Audio itself streams from googlevideo.com, which deliberately stays direct: only
# the app/API side (the part that is geo-checked) goes through WARP.
priority=1
domains=music.youtube.com
